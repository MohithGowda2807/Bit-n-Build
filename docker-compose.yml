version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: oceansentinel-db
    environment:
      POSTGRES_USER: oceansentinel
      POSTGRES_PASSWORD: oceansentinel
      POSTGRES_DB: oceansentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceansentinel -d oceansentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oceansentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceansentinel-backend
    environment:
      - DATABASE_URL=postgresql://oceansentinel:oceansentinel@db:5432/oceansentinel
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - GRID_VERSION=1.0.0
      - REFERENCE_SPEED_KNOTS=15.0
      - FUEL_PRICE_PER_LITER=0.85
      - CO2_EMISSION_FACTOR=3.114
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oceansentinel-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
