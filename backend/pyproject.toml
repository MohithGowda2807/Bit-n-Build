[project]
name = "oceansentinel-backend"
version = "0.1.0"
description = "OceanSentinel maritime intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.9",
    "shapely>=2.0.3",
    "redis>=5.0.2",
    "httpx>=0.27.0",
    "alembic>=1.13.1",
    "websockets>=12.0",
    "crewai[google-genai]>=1.15.21",
    "pyjwt>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
